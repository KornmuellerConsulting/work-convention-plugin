title = "kornmueller-empire-gitleaks-config"

[allowlist]
description = "Allow placeholders in .env.example and templates"
paths = [
  '''\.env\.example$''',
  '''templates/''',
  '''docs/''',
  '''CHANGELOG\.md$''',
]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-api[0-9]{2}-[a-zA-Z0-9_-]{50,}'''

[[rules]]
id = "slack-bot-token"
description = "Slack Bot Token"
regex = '''xoxb-[0-9]{10,}-[0-9]{10,}-[a-zA-Z0-9]{24,}'''

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[a-zA-Z0-9]{36}'''

[[rules]]
id = "stripe-live-key"
description = "Stripe Live Secret"
regex = '''sk_live_[a-zA-Z0-9]{24,}'''

[[rules]]
id = "supabase-service-role"
description = "Supabase Service Role Key (JWT-like)"
regex = '''eyJ[A-Za-z0-9_-]{30,}\.eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}'''
